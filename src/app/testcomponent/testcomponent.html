<p>Chez Angular ça marche comme ça</p>

<h1>{{ title }}</h1>

<button [disabled]="isDisabled"
(click)="onClick()">Un bouton, comme quand t'étais jeune</button>

<h2>{{ count() }}</h2>
<h2>{{ doubleCount()}}</h2>

<button (click)="increase()">+</button>
<button (click)="decrease()">-</button>
<button (click)="reset()">Reset</button>
